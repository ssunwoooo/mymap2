
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>버스 정류장 및 터미널 검색</title>

    <!-- 카카오맵 SDK와 장소 검색 라이브러리 불러오기 -->
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=c93a62ed63bfb3b516b4d5e7c03257db&libraries=services&autoload=false"></script>

    <style>
        /* 모든 요소의 크기 계산 방식을 통일 */
        * {
            box-sizing: border-box;
        }

        /* 페이지 기본 설정 */
        body {
            margin: 0;
            font-family: Arial, "Malgun Gothic", sans-serif;
        }

        /* 화면을 좌우 2분할 */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* 왼쪽 검색 영역 */
        .sidebar {
            width: 360px;
            min-width: 300px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            border-right: 1px solid #dddddd;
        }

        /* 제목 */
        h1 {
            margin: 0 0 18px;
            font-size: 23px;
        }

        /* 탭 버튼 */
        .tab-container {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .tab-button {
            flex: 1;
            padding: 12px 5px;
            border: 1px solid #dddddd;
            border-radius: 8px;
            background-color: #f5f5f5;
            cursor: pointer;
            font-size: 14px;
        }

        /* 선택된 탭 */
        .tab-button.active {
            background-color: #fee500;
            border-color: #e8d200;
            font-weight: bold;
        }

        /* 현재 위치 버튼 */
        #locationButton {
            width: 100%;
            padding: 11px;
            border: 1px solid #dddddd;
            border-radius: 8px;
            background-color: #ffffff;
            cursor: pointer;
        }

        #locationButton:hover {
            background-color: #f5f5f5;
        }

        /* 상태 안내 문구 */
        #status {
            margin: 15px 0 10px;
            color: #666666;
            font-size: 13px;
            line-height: 1.6;
        }

        /* 검색 결과 목록 */
        #results {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }

        /* 검색 결과 항목 */
        .place-item {
            padding: 13px 8px;
            border-bottom: 1px solid #eeeeee;
            cursor: pointer;
            border-radius: 5px;
        }

        .place-item:hover {
            background-color: #f8f8f8;
        }

        .place-item.selected {
            background-color: #fff9cc;
        }

        .place-name {
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: bold;
            line-height: 1.5;
        }

        .place-address {
            color: #666666;
            font-size: 12px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .place-distance {
            margin-top: 5px;
            color: #777777;
            font-size: 12px;
        }

        /* 오른쪽 지도 */
        #map {
            flex: 1;
            min-width: 0;
            height: 100%;
            background-color: #eeeeee;
        }

        /* 작은 화면에서도 검색 영역을 표시 */
        @media (max-width: 600px) {
            .sidebar {
                width: 42%;
                min-width: 155px;
                padding: 10px;
            }

            h1 {
                font-size: 17px;
            }

            .tab-container {
                gap: 4px;
            }

            .tab-button {
                padding: 10px 3px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- 왼쪽: 탭과 검색 결과 -->
        <aside class="sidebar">
            <h1>🚌 버스 검색</h1>

            <div class="tab-container">
                <button
                    class="tab-button active"
                    id="stopTab"
                    aria-pressed="true">
                    버스 정류장
                </button>

                <button
                    class="tab-button"
                    id="terminalTab"
                    aria-pressed="false">
                    버스 터미널
                </button>
            </div>

            <button id="locationButton">
                📍 현재 위치로 이동
            </button>

            <p id="status" role="status" aria-live="polite">
                지도를 불러오는 중입니다...
            </p>

            <div id="results"></div>
        </aside>

        <!-- 오른쪽: 카카오맵 -->
        <main id="map"></main>
    </div>

    <script>
        // 지도와 검색 기능에 필요한 변수
        let map;
        let places;
        let currentOverlay;
        let infoWindow;

        // 검색 결과 마커와 장소 정보를 저장
        let resultMarkers = [];
        let currentPlaces = [];

        // 현재 선택한 탭
        let selectedType = "stop";

        // 지도 준비 여부
        let isMapReady = false;

        // 기본 위치: 서울시청
        let currentLatitude = 37.5665;
        let currentLongitude = 126.9780;

        // HTML 요소를 변수에 저장
        const stopTab = document.getElementById("stopTab");
        const terminalTab = document.getElementById("terminalTab");
        const locationButton = document.getElementById("locationButton");
        const statusText = document.getElementById("status");
        const resultsContainer = document.getElementById("results");

        // 버스 모양 마커 이미지 주소
        const busImageUrl =
            "https://upload.wikimedia.org/wikipedia/commons/4/4b/Bus_icon_black_and_transparent_background.svg";

        // 지도에 표시할 버스 마커 이미지 설정
        const busImage = new kakao.maps.MarkerImage(
            busImageUrl,
            new kakao.maps.Size(32, 32),
            {
                offset: new kakao.maps.Point(16, 16)
            }
        );

        // 카카오맵 SDK가 준비된 후 지도 생성
        kakao.maps.load(function () {
            try {
                // 기본 지도 중심 좌표
                const center = new kakao.maps.LatLng(
                    currentLatitude,
                    currentLongitude
                );

                // 지도 생성 및 확대 레벨 설정
                map = new kakao.maps.Map(
                    document.getElementById("map"),
                    {
                        center: center,
                        level: 5
                    }
                );

                // 장소 검색 서비스 생성
                places = new kakao.maps.services.Places();

                // 마커 클릭 시 장소 정보를 표시하는 창
                infoWindow = new kakao.maps.InfoWindow({
                    zIndex: 10
                });

                // 현재 위치를 표시하는 파란색 원형 마커
                currentOverlay = new kakao.maps.CustomOverlay({
                    position: center,
                    content:
                        '<div style="' +
                        'width:20px;height:20px;' +
                        'background:#4285f4;' +
                        'border:3px solid white;' +
                        'border-radius:50%;' +
                        'box-shadow:0 1px 5px #777;' +
                        '"></div>',
                    yAnchor: 0.5,
                    zIndex: 5
                });

                currentOverlay.setMap(map);

                // 지도 준비 완료
                isMapReady = true;

                // 현재 위치 확인 후 주변 장소 검색
                getCurrentLocation();

            } catch (error) {
                console.error("지도 생성 오류:", error);

                statusText.textContent =
                    "지도를 불러오지 못했습니다. 카카오 키와 도메인 설정을 확인해 주세요.";
            }
        });

        // 현재 위치를 확인하는 함수
        function getCurrentLocation() {
            if (!navigator.geolocation) {
                statusText.textContent =
                    "위치 기능을 지원하지 않아 서울시청 주변을 검색합니다.";

                searchNearbyPlaces();
                return;
            }

            statusText.textContent = "현재 위치를 확인하고 있습니다.";

            // 브라우저의 위치 권한 요청
            navigator.geolocation.getCurrentPosition(
                function (position) {
                    // 현재 위도와 경도 저장
                    currentLatitude = position.coords.latitude;
                    currentLongitude = position.coords.longitude;

                    const positionPoint = new kakao.maps.LatLng(
                        currentLatitude,
                        currentLongitude
                    );

                    // 지도와 현재 위치 마커 이동
                    map.setCenter(positionPoint);
                    currentOverlay.setPosition(positionPoint);

                    // 현재 위치 주변 검색
                    searchNearbyPlaces();
                },

                function (error) {
                    console.warn("현재 위치 확인 실패:", error.message);

                    statusText.textContent =
                        "위치를 확인하지 못해 서울시청 주변을 검색합니다.";

                    // 위치 확인에 실패하면 기본 위치 사용
                    searchNearbyPlaces();
                },

                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 60000
                }
            );
        }

        // 선택한 탭에 맞는 검색어 반환
        function getSearchKeyword() {
            if (selectedType === "stop") {
                return "버스 정류장";
            }

            return "버스 터미널";
        }

        // 기존 검색 결과와 마커 삭제
        function clearResults() {
            resultMarkers.forEach(function (marker) {
                marker.setMap(null);
            });

            resultMarkers = [];
            currentPlaces = [];

            // 왼쪽 검색 목록 비우기
            resultsContainer.replaceChildren();

            // 이전 팝업 닫기
            if (infoWindow) {
                infoWindow.close();
            }
        }

        // 현재 위치 주변의 장소 검색
        function searchNearbyPlaces() {
            if (!isMapReady || !places) {
                return;
            }

            // 기존 결과를 먼저 제거
            clearResults();

            const keyword = getSearchKeyword();

            statusText.textContent =
                keyword + "을(를) 검색하고 있습니다...";

            // 현재 위치를 검색 중심으로 지정
            const searchCenter = new kakao.maps.LatLng(
                currentLatitude,
                currentLongitude
            );

            // 카카오맵 키워드 검색 실행
            places.keywordSearch(
                keyword,
                function (data, status) {
                    // 검색 결과가 있는 경우
                    if (status === kakao.maps.services.Status.OK) {
                        // 가까운 장소부터 정렬
                        data.sort(function (a, b) {
                            const distanceA = Number(a.distance || Infinity);
                            const distanceB = Number(b.distance || Infinity);

                            return distanceA - distanceB;
                        });

                        currentPlaces = data;

                        // 검색 결과를 목록과 지도에 표시
                        displayPlaces(data);

                        statusText.textContent =
                            "검색 결과 " + data.length + "개를 찾았습니다.";

                    } else if (
                        status === kakao.maps.services.Status.ZERO_RESULT
                    ) {
                        statusText.textContent =
                            "검색 결과가 없습니다. 다른 탭을 선택해 보세요.";

                    } else {
                        statusText.textContent =
                            "검색에 실패했습니다. 잠시 후 다시 시도해 주세요.";
                    }
                },
                {
                    location: searchCenter,
                    radius: 5000,
                    sort: kakao.maps.services.SortBy.DISTANCE,
                    size: 15
                }
            );
        }

        // 검색 결과를 버스 마커와 목록으로 표시
        function displayPlaces(placesData) {
            resultsContainer.replaceChildren();

            placesData.forEach(function (place) {
                // 검색 결과의 좌표
                const position = new kakao.maps.LatLng(
                    Number(place.y),
                    Number(place.x)
                );

                // 버스 아이콘을 사용하는 마커 생성
                const placeMarker = new kakao.maps.Marker({
                    map: map,
                    position: position,
                    title: place.place_name,
                    image: busImage
                });

                // 마커를 배열에 저장
                resultMarkers.push(placeMarker);

                // 왼쪽 검색 목록 항목 생성
                const item = document.createElement("div");
                item.className = "place-item";

                const name = document.createElement("div");
                name.className = "place-name";
                name.textContent = place.place_name;

                const address = document.createElement("div");
                address.className = "place-address";
                address.textContent =
                    place.road_address_name ||
                    place.address_name ||
                    "주소 정보 없음";

                item.appendChild(name);
                item.appendChild(address);

                // 장소와 현재 위치 사이의 거리를 표시
                if (place.distance) {
                    const distance = document.createElement("div");
                    distance.className = "place-distance";

                    const distanceValue = Number(place.distance);

                    distance.textContent =
                        distanceValue >= 1000
                            ? (distanceValue / 1000).toFixed(1) + "km"
                            : distanceValue + "m";

                    item.appendChild(distance);
                }

                // 목록 또는 마커를 클릭했을 때 실행
                function selectPlace() {
                    const selectedPosition = new kakao.maps.LatLng(
                        Number(place.y),
                        Number(place.x)
                    );

                    // 선택한 장소로 지도 이동
                    map.panTo(selectedPosition);

                    // 이전 선택 항목의 배경색 제거
                    document.querySelectorAll(".place-item").forEach(
                        function (element) {
                            element.classList.remove("selected");
                        }
                    );

                    item.classList.add("selected");

                    // 장소 이름과 주소를 팝업에 표시
                    const popupContent = document.createElement("div");

                    popupContent.style.cssText =
                        "padding:10px;max-width:230px;" +
                        "font-size:13px;line-height:1.6;";

                    const popupName = document.createElement("strong");
                    popupName.textContent = place.place_name;

                    const popupAddress = document.createElement("div");
                    popupAddress.textContent =
                        place.road_address_name ||
                        place.address_name ||
                        "주소 정보 없음";

                    popupContent.appendChild(popupName);
                    popupContent.appendChild(popupAddress);

                    infoWindow.setContent(popupContent);
                    infoWindow.open(map, placeMarker);

                    statusText.textContent =
                        place.place_name + " 위치를 표시했습니다.";
                }

                // 왼쪽 목록을 클릭하면 장소로 이동
                item.addEventListener("click", selectPlace);

                // 지도 마커를 클릭해도 팝업 표시
                kakao.maps.event.addListener(
                    placeMarker,
                    "click",
                    selectPlace
                );

                // 목록에 검색 결과 추가
                resultsContainer.appendChild(item);
            });
        }

        // 버스 정류장 탭 클릭
        stopTab.addEventListener("click", function () {
            if (selectedType === "stop") {
                return;
            }

            selectedType = "stop";

            // 탭의 선택 상태 변경
            stopTab.classList.add("active");
            terminalTab.classList.remove("active");

            stopTab.setAttribute("aria-pressed", "true");
            terminalTab.setAttribute("aria-pressed", "false");

            // 이전 결과를 지우고 정류장 검색
            searchNearbyPlaces();
        });

        // 버스 터미널 탭 클릭
        terminalTab.addEventListener("click", function () {
            if (selectedType === "terminal") {
                return;
            }

            selectedType = "terminal";

            // 탭의 선택 상태 변경
            terminalTab.classList.add("active");
            stopTab.classList.remove("active");

            terminalTab.setAttribute("aria-pressed", "true");
            stopTab.setAttribute("aria-pressed", "false");

            // 이전 결과를 지우고 터미널 검색
            searchNearbyPlaces();
        });

        // 현재 위치 버튼 클릭 시 위치 다시 확인
        locationButton.addEventListener("click", function () {
            if (!isMapReady) {
                return;
            }

            getCurrentLocation();
        });
    </script>
</body>
</html>
