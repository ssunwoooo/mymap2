
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>버스 정류장 지도</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #222;
    }

    .container {
      display: flex;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    .sidebar {
      width: 350px;
      min-width: 280px;
      display: flex;
      flex-direction: column;
      background: white;
      border-right: 1px solid #ddd;
    }

    .header {
      padding: 20px 16px 12px;
      background: #eaf4ff;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .description {
      margin: 0;
      font-size: 13px;
      color: #555;
    }

    .tabs {
      display: flex;
      gap: 8px;
      padding: 12px 12px 0;
    }

    .tab {
      flex: 1;
      padding: 11px 5px;
      border: 1px solid #ddd;
      border-radius: 8px 8px 0 0;
      background: #f7f7f7;
      cursor: pointer;
    }

    .tab.active {
      color: white;
      background: #1677e8;
      border-color: #1677e8;
      font-weight: bold;
    }

    .search-area {
      display: flex;
      gap: 6px;
      padding: 12px;
    }

    #searchInput {
      flex: 1;
      min-width: 0;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 14px;
    }

    #searchButton {
      padding: 0 13px;
      border: 0;
      border-radius: 7px;
      background: #1677e8;
      color: white;
      cursor: pointer;
    }

    #status {
      padding: 0 14px 10px;
      color: #666;
      font-size: 13px;
    }

    #resultList {
      flex: 1;
      overflow-y: auto;
      border-top: 1px solid #eee;
    }

    .result-item {
      padding: 14px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .result-item:hover {
      background: #f3f8ff;
    }

    .place-name {
      margin-bottom: 6px;
      font-size: 15px;
      font-weight: bold;
    }

    .place-address {
      color: #666;
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .map-area {
      flex: 1;
      min-width: 0;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* 버스 아이콘 마커 */
    .bus-marker {
      width: 42px;
      height: 49px;
      cursor: pointer;
      filter: drop-shadow(0 2px 2px #0003);
    }

    .bus-marker svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 현재 위치 마커 */
    .my-location-marker {
      width: 30px;
      height: 30px;
      border: 4px solid white;
      border-radius: 50%;
      background: #1677e8;
      box-shadow: 0 0 0 5px #1677e833,
                  0 2px 6px #0003;
    }

    .legend {
      position: absolute;
      z-index: 5;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 9px 13px;
      border-radius: 24px;
      background: white;
      box-shadow: 0 2px 10px #0002;
      font-size: 12px;
      white-space: nowrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .legend-bus {
      width: 23px;
      height: 27px;
    }

    .legend-location {
      width: 14px;
      height: 14px;
      border: 3px solid white;
      border-radius: 50%;
      background: #1677e8;
      box-shadow: 0 0 0 2px #1677e8;
    }

    .info-window {
      padding: 10px;
      min-width: 170px;
      max-width: 240px;
      font-size: 12px;
      line-height: 1.6;
    }

    .info-name {
      margin-bottom: 4px;
      font-size: 14px;
      font-weight: bold;
    }

    @media (max-width: 650px) {
      .sidebar {
        width: 44%;
        min-width: 155px;
      }

      .header { padding: 14px 10px 10px; }
      h1 { font-size: 17px; }
      .description { font-size: 11px; }
      .tabs { padding: 8px 6px 0; gap: 4px; }
      .tab { padding: 9px 3px; font-size: 12px; }
      .search-area { padding: 8px 6px; }

      #searchInput {
        padding: 8px 5px;
        font-size: 12px;
      }

      #searchButton {
        padding: 0 8px;
        font-size: 12px;
      }

      .result-item { padding: 10px 8px; }
      .place-name { font-size: 13px; }
      .place-address { font-size: 11px; }

      .legend {
        bottom: 10px;
        gap: 8px;
        padding: 8px 10px;
        font-size: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <aside class="sidebar">
      <div class="header">
        <h1>🚌 버스 찾기</h1>
        <p class="description">
          주변 버스 정류장과 터미널을 찾아보세요.
        </p>
      </div>

      <div class="tabs">
        <button class="tab active" data-keyword="버스정류장">
          버스 정류장
        </button>
        <button class="tab" data-keyword="버스터미널">
          버스 터미널
        </button>
      </div>

      <div class="search-area">
        <input id="searchInput" type="text"
               placeholder="장소 이름 검색">
        <button id="searchButton">검색</button>
      </div>

      <div id="status">지도를 불러오는 중...</div>
      <div id="resultList"></div>
    </aside>

    <main class="map-area">
      <div id="map"></div>

      <div class="legend">
        <div class="legend-item">
          <div class="legend-bus" id="busLegend"></div>
          <span>버스 정류장</span>
        </div>
        <div class="legend-item">
          <span class="legend-location"></span>
          <span>내 위치</span>
        </div>
      </div>
    </main>
  </div>

  <!-- 카카오 지도 API -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=c93a62ed63bfb3b516b4d5e7c03257db&libraries=services"></script>

  <script>
    let map;
    let places;
    let currentMarker = null;
    let currentPosition = null;
    let currentInfoWindow = null;
    let resultMarkers = [];
    let selectedKeyword = "버스정류장";
    let searchRequestId = 0;

    // 버스 마커에 표시할 SVG 이미지
    const busSvg = `
      <svg xmlns="http://www.w3.org/2000/svg"
           width="48" height="56" viewBox="0 0 48 56">
        <path d="M24 2 C11 2 3 11 3 24
                 C3 38 24 54 24 54
                 S45 38 45 24 C45 11 37 2 24 2Z"
              fill="#1677e8" stroke="#ffffff" stroke-width="2"/>
        <rect x="12" y="12" width="24" height="27"
              rx="4" fill="#ffffff"/>
        <rect x="16" y="16" width="16" height="9"
              rx="1" fill="#1677e8"/>
        <rect x="16" y="28" width="16" height="5"
              rx="1" fill="#1677e8"/>
        <circle cx="18" cy="37" r="2" fill="#1677e8"/>
        <circle cx="30" cy="37" r="2" fill="#1677e8"/>
      </svg>
    `;

    // 범례에 버스 아이콘 표시
    document.getElementById("busLegend").innerHTML = busSvg;

    // 상태 메시지 표시
    function setStatus(message) {
      document.getElementById("status").textContent = message;
    }

    // 이전 검색 마커와 목록 지우기
    function clearResultMarkers() {
      resultMarkers.forEach(function(marker) {
        marker.setMap(null);
      });

      resultMarkers = [];

      if (currentInfoWindow) {
        currentInfoWindow.close();
        currentInfoWindow = null;
      }

      document.getElementById("resultList").innerHTML = "";
    }

    // 지도 시작
    function startMap() {
      const center = new kakao.maps.LatLng(
        37.5665, 126.9780
      );

      map = new kakao.maps.Map(
        document.getElementById("map"),
        {
          center: center,
          level: 5
        }
      );

      places = new kakao.maps.services.Places();

      // 현재 위치 가져오기
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function(position) {
            currentPosition = new kakao.maps.LatLng(
              position.coords.latitude,
              position.coords.longitude
            );

            // 내 위치는 파란색 원형 마커로 표시
            const locationContent = document.createElement("div");
            locationContent.className = "my-location-marker";
            locationContent.title = "내 현재 위치";

            currentMarker = new kakao.maps.CustomOverlay({
              map: map,
              position: currentPosition,
              content: locationContent,
              xAnchor: 0.5,
              yAnchor: 0.5,
              zIndex: 10
            });

            map.setCenter(currentPosition);
            map.setLevel(5);

            searchPlaces();
          },
          function() {
            setStatus(
              "현재 위치를 가져오지 못했어요. 서울을 기준으로 검색해요."
            );
            searchPlaces();
          },
          {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 60000
          }
        );
      } else {
        setStatus("현재 위치 기능을 지원하지 않는 환경이에요.");
        searchPlaces();
      }
    }

    // 장소 정보 말풍선 표시
    function openPlaceInfo(place, position) {
      if (currentInfoWindow) {
        currentInfoWindow.close();
      }

      const content = document.createElement("div");
      content.className = "info-window";

      const name = document.createElement("div");
      name.className = "info-name";
      name.textContent = place.place_name;

      const address = document.createElement("div");
      address.textContent =
        place.road_address_name ||
        place.address_name ||
        "주소 정보 없음";

      content.appendChild(name);
      content.appendChild(address);

      currentInfoWindow = new kakao.maps.InfoWindow({
        content: content,
        removable: true
      });

      currentInfoWindow.open(map, position);
    }

    // 버스 마커를 HTML로 생성
    // 이미지 파일을 별도로 올리지 않아도 표시된다.
    function addResultMarker(place) {
      const position = new kakao.maps.LatLng(
        Number(place.y),
        Number(place.x)
      );

      const markerContent = document.createElement("div");
      markerContent.className = "bus-marker";
      markerContent.innerHTML = busSvg;
      markerContent.title = place.place_name;

      const marker = new kakao.maps.CustomOverlay({
        map: map,
        position: position,
        content: markerContent,
        xAnchor: 0.5,
        yAnchor: 1,
        zIndex: 5,
        clickable: true
      });

      resultMarkers.push(marker);

      // 버스 아이콘을 누르면 장소 정보 표시
      markerContent.addEventListener("click", function(event) {
        event.stopPropagation();
        openPlaceInfo(place, position);
      });

      return marker;
    }

    // 왼쪽 검색 결과 목록에 장소 추가
    function addResultItem(place, marker) {
      const list = document.getElementById("resultList");
      const item = document.createElement("div");
      item.className = "result-item";

      const name = document.createElement("div");
      name.className = "place-name";
      name.textContent = place.place_name;

      const address = document.createElement("div");
      address.className = "place-address";
      address.textContent =
        place.road_address_name ||
        place.address_name ||
        "주소 정보 없음";

      item.appendChild(name);
      item.appendChild(address);

      // 결과를 누르면 해당 장소로 이동
      item.addEventListener("click", function() {
        const position = marker.getPosition();
        map.panTo(position);
        map.setLevel(4);
        openPlaceInfo(place, position);
      });

      list.appendChild(item);
    }

    // 장소 검색
    function searchPlaces() {
      const requestId = ++searchRequestId;

      clearResultMarkers();
      setStatus("검색 중이에요...");

      const inputValue =
        document.getElementById("searchInput").value.trim();

      const keyword = inputValue
        ? selectedKeyword + " " + inputValue
        : selectedKeyword;

      const options = {
        size: 15,
        sort: currentPosition
          ? kakao.maps.services.SortBy.DISTANCE
          : kakao.maps.services.SortBy.ACCURACY
      };

      // 현재 위치가 있으면 주변 20km를 검색
      if (currentPosition) {
        options.location = currentPosition;
        options.radius = 20000;
      }

      places.keywordSearch(
        keyword,
        function(data, status) {
          // 이전 검색 요청의 늦은 결과는 무시
          if (requestId !== searchRequestId) {
            return;
          }

          if (status === kakao.maps.services.Status.OK) {
            data.forEach(function(place) {
              const marker = addResultMarker(place);
              addResultItem(place, marker);
            });

            setStatus("검색 결과 " + data.length + "개");

            if (!currentPosition && data.length > 0) {
              map.setCenter(
                new kakao.maps.LatLng(data[0].y, data[0].x)
              );
            }
          } else if (
            status === kakao.maps.services.Status.ZERO_RESULT
          ) {
            setStatus(
              "검색 결과가 없어요. 다른 검색어를 입력해 보세요."
            );
          } else {
            setStatus(
              "검색 중 문제가 발생했어요. 다시 시도해 주세요."
            );
          }
        },
        options
      );
    }

    // 탭 전환
    document.querySelectorAll(".tab").forEach(function(button) {
      button.addEventListener("click", function() {
        document.querySelectorAll(".tab").forEach(function(tab) {
          tab.classList.remove("active");
        });

        button.classList.add("active");
        selectedKeyword = button.dataset.keyword;
        document.getElementById("searchInput").value = "";

        searchPlaces();
      });
    });

    // 검색 버튼
    document.getElementById("searchButton").addEventListener(
      "click",
      searchPlaces
    );

    // Enter 키로 검색
    document.getElementById("searchInput").addEventListener(
      "keydown",
      function(event) {
        if (event.key === "Enter") {
          searchPlaces();
        }
      }
    );

    // 카카오맵 API 확인 후 지도 시작
    if (window.kakao && kakao.maps) {
      startMap();
    } else {
      setStatus(
        "카카오맵을 불러오지 못했어요. API 키와 도메인 설정을 확인해 주세요."
      );
    }
  </script>
</body>
</html>
