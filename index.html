
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>버스 정류장 지도</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #222;
    }

    .container {
      display: flex;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    .sidebar {
      width: 350px;
      min-width: 280px;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-right: 1px solid #ddd;
    }

    .header {
      padding: 20px 16px 12px;
      background: #eaf4ff;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .description {
      margin: 0;
      font-size: 13px;
      color: #555;
    }

    .tabs {
      display: flex;
      padding: 12px 12px 0;
      gap: 8px;
    }

    .tab {
      flex: 1;
      padding: 11px 5px;
      border: 1px solid #ddd;
      border-radius: 8px 8px 0 0;
      background: #f7f7f7;
      cursor: pointer;
      font-size: 14px;
    }

    .tab.active {
      color: white;
      background: #1677e8;
      border-color: #1677e8;
      font-weight: bold;
    }

    .search-area {
      display: flex;
      gap: 6px;
      padding: 12px;
    }

    #searchInput {
      flex: 1;
      min-width: 0;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 14px;
    }

    #searchButton {
      padding: 0 13px;
      border: none;
      border-radius: 7px;
      background: #1677e8;
      color: white;
      cursor: pointer;
    }

    #status {
      padding: 0 14px 10px;
      color: #666;
      font-size: 13px;
    }

    #resultList {
      flex: 1;
      overflow-y: auto;
      border-top: 1px solid #eee;
    }

    .result-item {
      padding: 14px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .result-item:hover {
      background: #f3f8ff;
    }

    .place-name {
      margin-bottom: 6px;
      font-size: 15px;
      font-weight: bold;
    }

    .place-address {
      color: #666;
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .map-area {
      flex: 1;
      min-width: 0;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .legend {
      position: absolute;
      z-index: 5;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 9px 13px;
      border-radius: 24px;
      background: white;
      box-shadow: 0 2px 10px #0002;
      font-size: 12px;
      white-space: nowrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .legend-bus {
      width: 22px;
      height: 22px;
      object-fit: contain;
    }

    .legend-location {
      width: 15px;
      height: 15px;
      border: 3px solid white;
      border-radius: 50%;
      background: #1677e8;
      box-shadow: 0 0 0 2px #1677e8;
    }

    .info-window {
      padding: 10px;
      min-width: 170px;
      max-width: 240px;
      font-size: 12px;
      line-height: 1.6;
    }

    .info-name {
      margin-bottom: 4px;
      font-size: 14px;
      font-weight: bold;
    }

    @media (max-width: 650px) {
      .sidebar {
        width: 44%;
        min-width: 155px;
      }

      .header {
        padding: 14px 10px 10px;
      }

      h1 {
        font-size: 17px;
      }

      .description {
        font-size: 11px;
      }

      .tabs {
        padding: 8px 6px 0;
        gap: 4px;
      }

      .tab {
        padding: 9px 3px;
        font-size: 12px;
      }

      .search-area {
        padding: 8px 6px;
      }

      #searchInput {
        padding: 8px 5px;
        font-size: 12px;
      }

      #searchButton {
        padding: 0 8px;
        font-size: 12px;
      }

      .result-item {
        padding: 10px 8px;
      }

      .place-name {
        font-size: 13px;
      }

      .place-address {
        font-size: 11px;
      }

      .legend {
        bottom: 10px;
        gap: 8px;
        padding: 8px 10px;
        font-size: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <aside class="sidebar">
      <div class="header">
        <h1>🚌 버스 찾기</h1>
        <p class="description">
          주변 버스 정류장과 터미널을 찾아보세요.
        </p>
      </div>

      <div class="tabs">
        <button class="tab active"
                data-keyword="버스정류장">
          버스 정류장
        </button>

        <button class="tab"
                data-keyword="버스터미널">
          버스 터미널
        </button>
      </div>

      <div class="search-area">
        <input
          id="searchInput"
          type="text"
          placeholder="장소 이름 검색"
        >
        <button id="searchButton">검색</button>
      </div>

      <div id="status">지도를 준비하고 있어요...</div>
      <div id="resultList"></div>
    </aside>

    <main class="map-area">
      <div id="map"></div>

      <div class="legend">
        <div class="legend-item">
          <img id="busLegend" class="legend-bus" alt="버스">
          <span>버스 정류장</span>
        </div>

        <div class="legend-item">
          <span class="legend-location"></span>
          <span>내 위치</span>
        </div>
      </div>
    </main>

  </div>

  <!-- 카카오 지도 API -->
  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=c93a62ed63bfb3b516b4d5e7c03257db&libraries=services">
  </script>

  <script>
    // 지도와 검색에 사용할 변수
    let map;
    let places;
    let currentMarker = null;
    let currentPosition = null;
    let currentInfoWindow = null;

    let resultMarkers = [];
    let selectedKeyword = "버스정류장";
    let searchRequestId = 0;

    // 버스 아이콘 이미지 만들기
    // 별도 이미지 파일 없이 코드 안에서 생성한다.
    const busSvg = `
      <svg xmlns="http://www.w3.org/2000/svg"
           width="48" height="56" viewBox="0 0 48 56">
        <path d="M24 1 C11 1 2 11 2 24
                 C2 39 24 55 24 55
                 S46 39 46 24 C46 11 37 1 24 1Z"
              fill="#1677e8" stroke="white" stroke-width="2"/>
        <rect x="11" y="11" width="26" height="29"
              rx="5" fill="white"/>
        <rect x="15" y="15" width="18" height="11"
              rx="2" fill="#1677e8"/>
        <rect x="15" y="29" width="18" height="5"
              rx="1" fill="#1677e8"/>
        <circle cx="17" cy="38" r="2" fill="#1677e8"/>
        <circle cx="31" cy="38" r="2" fill="#1677e8"/>
      </svg>
    `;

    // 내 위치 아이콘 만들기
    const locationSvg = `
      <svg xmlns="http://www.w3.org/2000/svg"
           width="40" height="40" viewBox="0 0 40 40">
        <circle cx="20" cy="20" r="17"
                fill="#1677e8" opacity="0.2"/>
        <circle cx="20" cy="20" r="10"
                fill="#1677e8" stroke="white"
                stroke-width="4"/>
      </svg>
    `;

    // SVG를 지도에서 사용할 수 있는 이미지 주소로 변환
    function svgToDataUrl(svg) {
      return "data:image/svg+xml;charset=utf-8,"
        + encodeURIComponent(svg);
    }

    const busImageUrl = svgToDataUrl(busSvg);
    const locationImageUrl = svgToDataUrl(locationSvg);

    // 범례에도 버스 아이콘 표시
    document.getElementById("busLegend").src = busImageUrl;

    // 화면에 상태 안내 표시
    function setStatus(message) {
      document.getElementById("status").textContent = message;
    }

    // 검색 결과에 사용한 기존 마커 삭제
    function clearResultMarkers() {
      resultMarkers.forEach(function(marker) {
        marker.setMap(null);
      });

      resultMarkers = [];

      if (currentInfoWindow) {
        currentInfoWindow.close();
        currentInfoWindow = null;
      }

      document.getElementById("resultList").innerHTML = "";
    }

    // 지도 초기화
    function startMap() {
      const center = new kakao.maps.LatLng(
        37.5665,
        126.9780
      );

      map = new kakao.maps.Map(
        document.getElementById("map"),
        {
          center: center,
          level: 5
        }
      );

      places = new kakao.maps.services.Places();

      // 현재 위치 마커 이미지 설정
      const locationImage = new kakao.maps.MarkerImage(
        locationImageUrl,
        new kakao.maps.Size(40, 40),
        {
          offset: new kakao.maps.Point(20, 20)
        }
      );

      // 현재 위치를 가져온다.
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function(position) {
            currentPosition = new kakao.maps.LatLng(
              position.coords.latitude,
              position.coords.longitude
            );

            // 현재 위치에 별도 이미지 마커 표시
            currentMarker = new kakao.maps.Marker({
              map: map,
              position: currentPosition,
              title: "내 현재 위치",
              image: locationImage,
              zIndex: 10
            });

            map.setCenter(currentPosition);
            map.setLevel(5);

            searchPlaces();
          },
          function() {
            // 위치 권한을 허용하지 않아도 지도는 사용할 수 있다.
            setStatus("현재 위치를 가져오지 못했어요. 서울을 기준으로 검색해요.");
            searchPlaces();
          },
          {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 60000
          }
        );
      } else {
        setStatus("위치 기능을 지원하지 않는 환경이에요.");
        searchPlaces();
      }
    }

    // 검색 결과 말풍선 만들기
    function openPlaceInfo(place, position) {
      if (currentInfoWindow) {
        currentInfoWindow.close();
      }

      const content = document.createElement("div");
      content.className = "info-window";

      const name = document.createElement("div");
      name.className = "info-name";
      name.textContent = place.place_name;

      const address = document.createElement("div");
      address.textContent =
        place.road_address_name || place.address_name || "주소 정보 없음";

      content.appendChild(name);
      content.appendChild(address);

      currentInfoWindow = new kakao.maps.InfoWindow({
        content: content,
        removable: true
      });

      currentInfoWindow.open(map, position);
    }

    // 검색 결과에 버스 이미지 마커를 추가
    function addResultMarker(place) {
      const position = new kakao.maps.LatLng(
        Number(place.y),
        Number(place.x)
      );

      // 버스 정류장 마커 이미지 설정
      const busImage = new kakao.maps.MarkerImage(
        busImageUrl,
        new kakao.maps.Size(36, 42),
        {
          offset: new kakao.maps.Point(18, 42)
        }
      );

      const marker = new kakao.maps.Marker({
        map: map,
        position: position,
        title: place.place_name,
        image: busImage
      });

      resultMarkers.push(marker);

      // 마커를 누르면 장소 정보 표시
      kakao.maps.event.addListener(marker, "click", function() {
        openPlaceInfo(place, position);
      });

      return marker;
    }

    // 검색 결과 목록에 장소 추가
    function addResultItem(place, marker) {
      const list = document.getElementById("resultList");

      const item = document.createElement("div");
      item.className = "result-item";

      const name = document.createElement("div");
      name.className = "place-name";
      name.textContent = place.place_name;

      const address = document.createElement("div");
      address.className = "place-address";
      address.textContent =
        place.road_address_name || place.address_name || "주소 정보 없음";

      item.appendChild(name);
      item.appendChild(address);

      // 목록을 누르면 지도 중심을 해당 장소로 이동
      item.addEventListener("click", function() {
        const position = marker.getPosition();

        map.panTo(position);
        map.setLevel(4);

        openPlaceInfo(place, position);
      });

      list.appendChild(item);
    }

    // 장소 검색
    function searchPlaces() {
      const requestId = ++searchRequestId;

      clearResultMarkers();
      setStatus("검색 중이에요...");

      const inputValue =
        document.getElementById("searchInput").value.trim();

      // 입력한 검색어가 있으면 선택된 탭 키워드와 결합한다.
      const keyword = inputValue
        ? selectedKeyword + " " + inputValue
        : selectedKeyword;

      const options = {
        size: 15,
        sort: currentPosition
          ? kakao.maps.services.SortBy.DISTANCE
          : kakao.maps.services.SortBy.ACCURACY
      };

      // 현재 위치가 있으면 주변 20km 이내를 검색한다.
      if (currentPosition) {
        options.location = currentPosition;
        options.radius = 20000;
      }

      places.keywordSearch(
        keyword,
        function(data, status) {
          // 이전 검색 결과가 늦게 도착한 경우 무시
          if (requestId !== searchRequestId) {
            return;
          }

          if (status === kakao.maps.services.Status.OK) {
            data.forEach(function(place) {
              const marker = addResultMarker(place);
              addResultItem(place, marker);
            });

            setStatus("검색 결과 " + data.length + "개");

            // 현재 위치가 없을 때 첫 결과를 기준으로 지도 이동
            if (!currentPosition && data.length > 0) {
              map.setCenter(
                new kakao.maps.LatLng(data[0].y, data[0].x)
              );
            }
          } else if (
            status === kakao.maps.services.Status.ZERO_RESULT
          ) {
            setStatus("검색 결과가 없어요. 다른 검색어를 입력해 보세요.");
          } else {
            setStatus("검색 중 문제가 발생했어요. 다시 시도해 주세요.");
          }
        },
        options
      );
    }

    // 탭을 누르면 검색 종류 변경
    document.querySelectorAll(".tab").forEach(function(button) {
      button.addEventListener("click", function() {
        document.querySelectorAll(".tab").forEach(function(tab) {
          tab.classList.remove("active");
        });

        button.classList.add("active");
        selectedKeyword = button.dataset.keyword;

        document.getElementById("searchInput").value = "";

        searchPlaces();
      });
    });

    // 검색 버튼
    document.getElementById("searchButton").addEventListener(
      "click",
      searchPlaces
    );

    // 입력창에서 Enter를 눌러도 검색
    document.getElementById("searchInput").addEventListener(
      "keydown",
      function(event) {
        if (event.key === "Enter") {
          searchPlaces();
        }
      }
    );

    // SDK가 준비된 후 지도 실행
    if (window.kakao && kakao.maps) {
      startMap();
    } else {
      setStatus("카카오맵을 불러오지 못했어요. API 키와 도메인 설정을 확인해 주세요.");
    }
  </script>
</body>
</html>
