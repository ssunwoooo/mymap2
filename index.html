
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>버스 정류장 및 터미널 검색</title>

    <style>
        /* 모든 요소의 크기 계산 방식 통일 */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Malgun Gothic", sans-serif;
        }

        /* 화면 좌우 2분할 */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* 왼쪽 검색 영역 */
        .sidebar {
            display: flex;
            flex-direction: column;
            width: 360px;
            min-width: 300px;
            padding: 20px;
            border-right: 1px solid #dddddd;
            background: white;
        }

        h1 {
            margin: 0 0 18px;
            font-size: 23px;
        }

        /* 탭 버튼 */
        .tab-container {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .tab-button {
            flex: 1;
            padding: 12px 5px;
            border: 1px solid #dddddd;
            border-radius: 8px;
            background: #f5f5f5;
            cursor: pointer;
            font-size: 14px;
        }

        .tab-button.active {
            border-color: #e8d200;
            background: #fee500;
            font-weight: bold;
        }

        /* 현재 위치 버튼 */
        #locationButton {
            padding: 11px;
            border: 1px solid #dddddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
        }

        #status {
            margin: 15px 0 10px;
            color: #555555;
            font-size: 13px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        /* 검색 결과 목록 */
        #results {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }

        .place-item {
            padding: 13px 8px;
            border-bottom: 1px solid #eeeeee;
            border-radius: 5px;
            cursor: pointer;
        }

        .place-item:hover {
            background: #f8f8f8;
        }

        .place-item.selected {
            background: #fff9cc;
        }

        .place-name {
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: bold;
            line-height: 1.5;
        }

        .place-address {
            color: #666666;
            font-size: 12px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .place-distance {
            margin-top: 5px;
            color: #777777;
            font-size: 12px;
        }

        /* 오른쪽 지도 */
        #map {
            flex: 1;
            min-width: 0;
            height: 100%;
            background: #eeeeee;
        }

        @media (max-width: 600px) {
            .sidebar {
                width: 42%;
                min-width: 155px;
                padding: 10px;
            }

            h1 {
                font-size: 17px;
            }

            .tab-container {
                gap: 4px;
            }

            .tab-button {
                padding: 10px 3px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- 왼쪽: 검색 탭과 검색 결과 -->
        <aside class="sidebar">
            <h1>🚌 버스 검색</h1>

            <div class="tab-container">
                <button
                    id="stopTab"
                    class="tab-button active"
                    aria-pressed="true">
                    버스 정류장
                </button>

                <button
                    id="terminalTab"
                    class="tab-button"
                    aria-pressed="false">
                    버스 터미널
                </button>
            </div>

            <button id="locationButton">
                📍 현재 위치로 이동
            </button>

            <p id="status" role="status" aria-live="polite">
                카카오맵을 불러오는 중입니다...
            </p>

            <div id="results"></div>
        </aside>

        <!-- 오른쪽: 지도 -->
        <main id="map"></main>
    </div>

    <!-- 카카오맵 SDK: 오류 발생 시 안내 메시지 표시 -->
    <script
        src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=c93a62ed63bfb3b516b4d5e7c03257db&libraries=services&autoload=false"
        onerror="showSdkError()">
    </script>

    <script>
        // 지도와 검색 기능에 필요한 변수
        let map;
        let places;
        let currentOverlay;
        let infoWindow;
        let busImage;

        // 검색 결과 마커와 장소 정보
        let resultMarkers = [];
        let currentPlaces = [];

        // 현재 선택된 탭
        let selectedType = "stop";

        // 지도 초기화 여부와 검색 요청 번호
        let isMapReady = false;
        let searchRequestId = 0;

        // 기본 위치: 서울시청
        let currentLatitude = 37.5665;
        let currentLongitude = 126.9780;

        // HTML 요소를 변수에 저장
        const stopTab = document.getElementById("stopTab");
        const terminalTab = document.getElementById("terminalTab");
        const locationButton = document.getElementById("locationButton");
        const statusText = document.getElementById("status");
        const resultsContainer = document.getElementById("results");

        // SDK 파일을 불러오지 못했을 때 실행
        function showSdkError() {
            statusText.textContent =
                "카카오맵 SDK를 불러오지 못했습니다. 인터넷 연결과 JavaScript 키, 웹 도메인 설정을 확인해 주세요.";
        }

        // 지도 SDK 준비 후 초기화
        function initializeMap() {
            try {
                // 지도 중심 좌표 설정
                const center = new kakao.maps.LatLng(
                    currentLatitude,
                    currentLongitude
                );

                // 지도 생성: 확대 레벨 5
                map = new kakao.maps.Map(
                    document.getElementById("map"),
                    {
                        center: center,
                        level: 5
                    }
                );

                // 장소 검색 서비스 생성
                places = new kakao.maps.services.Places();

                // 장소 정보를 표시할 팝업 생성
                infoWindow = new kakao.maps.InfoWindow({
                    zIndex: 10
                });

                // 버스 아이콘은 SDK가 준비된 뒤 생성
                const busImageUrl =
                    "https://upload.wikimedia.org/wikipedia/commons/4/4b/Bus_icon_black_and_transparent_background.svg";

                busImage = new kakao.maps.MarkerImage(
                    busImageUrl,
                    new kakao.maps.Size(32, 32),
                    {
                        offset: new kakao.maps.Point(16, 16)
                    }
                );

                // 현재 위치를 표시하는 파란색 원형 마커
                currentOverlay = new kakao.maps.CustomOverlay({
                    position: center,
                    content:
                        '<div style="' +
                        'width:20px;height:20px;' +
                        'background:#4285f4;' +
                        'border:3px solid white;' +
                        'border-radius:50%;' +
                        'box-shadow:0 1px 5px #777;' +
                        '"></div>',
                    yAnchor: 0.5,
                    zIndex: 5
                });

                currentOverlay.setMap(map);

                // 모든 초기화가 끝난 뒤 검색 기능 활성화
                isMapReady = true;

                statusText.textContent =
                    "현재 위치를 확인하고 있습니다.";

                // 현재 위치 확인 후 주변 검색
                getCurrentLocation();

            } catch (error) {
                console.error("지도 초기화 오류:", error);

                statusText.textContent =
                    "지도 초기화에 실패했습니다. F12의 Console에서 오류를 확인해 주세요.";
            }
        }

        // SDK를 불러오고 초기화
        if (typeof kakao !== "undefined" && kakao.maps) {
            kakao.maps.load(initializeMap);
        } else {
            showSdkError();
        }

        // SDK가 인증 오류 등으로 초기화되지 않을 경우 안내
        setTimeout(function () {
            if (!isMapReady &&
                statusText.textContent ===
                "카카오맵을 불러오는 중입니다...") {
                statusText.textContent =
                    "지도가 아직 준비되지 않았습니다. JavaScript 키, 웹 도메인 설정과 F12 Console 오류를 확인해 주세요.";
            }
        }, 10000);

        // 현재 위치를 확인하는 함수
        function getCurrentLocation() {
            if (!isMapReady) return;

            if (!navigator.geolocation) {
                statusText.textContent =
                    "위치 기능을 지원하지 않아 서울시청 주변을 검색합니다.";

                searchNearbyPlaces();
                return;
            }

            statusText.textContent =
                "현재 위치를 확인하고 있습니다.";

            navigator.geolocation.getCurrentPosition(
                function (position) {
                    // 현재 위치의 위도와 경도 저장
                    currentLatitude = position.coords.latitude;
                    currentLongitude = position.coords.longitude;

                    const positionPoint = new kakao.maps.LatLng(
                        currentLatitude,
                        currentLongitude
                    );

                    // 지도와 현재 위치 표시 이동
                    map.setCenter(positionPoint);
                    currentOverlay.setPosition(positionPoint);

                    // 현재 위치 주변 검색
                    searchNearbyPlaces();
                },

                function (error) {
                    console.warn("현재 위치 확인 실패:", error.message);

                    statusText.textContent =
                        "현재 위치를 확인하지 못해 서울시청 주변을 검색합니다.";

                    // 위치 확인 실패 시 기본 위치 사용
                    searchNearbyPlaces();
                },

                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 60000
                }
            );
        }

        // 선택된 탭에 따라 검색어 결정
        function getSearchKeyword() {
            return selectedType === "stop"
                ? "버스 정류장"
                : "버스 터미널";
        }

        // 기존 검색 결과와 마커 삭제
        function clearResults() {
            resultMarkers.forEach(function (marker) {
                marker.setMap(null);
            });

            resultMarkers = [];
            currentPlaces = [];

            resultsContainer.replaceChildren();

            if (infoWindow) {
                infoWindow.close();
            }
        }

        // 주변 버스 장소 검색
        function searchNearbyPlaces() {
            if (!isMapReady || !places) return;

            // 새로운 검색 요청 번호 생성
            const requestId = ++searchRequestId;

            // 기존 결과 지우기
            clearResults();

            const keyword = getSearchKeyword();

            statusText.textContent =
                keyword + "을(를) 검색하고 있습니다...";

            const searchCenter = new kakao.maps.LatLng(
                currentLatitude,
                currentLongitude
            );

            // 현재 위치 기준 반경 5km 검색
            places.keywordSearch(
                keyword,
                function (data, status) {
                    // 이전 검색의 늦은 응답은 무시
                    if (requestId !== searchRequestId) return;

                    if (status === kakao.maps.services.Status.OK) {
                        // 가까운 장소부터 정렬
                        data.sort(function (a, b) {
                            return Number(a.distance || Infinity) -
                                Number(b.distance || Infinity);
                        });

                        currentPlaces = data;

                        // 검색 결과를 목록과 지도에 표시
                        displayPlaces(data);

                        statusText.textContent =
                            "검색 결과 " + data.length + "개를 찾았습니다.";

                    } else if (
                        status === kakao.maps.services.Status.ZERO_RESULT
                    ) {
                        statusText.textContent =
                            "검색 결과가 없습니다. 다른 탭을 선택해 보세요.";

                    } else {
                        statusText.textContent =
                            "검색에 실패했습니다. F12 Console에서 오류를 확인해 주세요.";
                    }
                },
                {
                    location: searchCenter,
                    radius: 5000,
                    sort: kakao.maps.services.SortBy.DISTANCE,
                    size: 15
                }
            );
        }

        // 검색 결과를 버스 마커와 목록에 표시
        function displayPlaces(placesData) {
            resultsContainer.replaceChildren();

            placesData.forEach(function (place) {
                // 검색 장소의 좌표
                const position = new kakao.maps.LatLng(
                    Number(place.y),
                    Number(place.x)
                );

                // 버스 이미지가 적용된 마커 생성
                const placeMarker = new kakao.maps.Marker({
                    map: map,
                    position: position,
                    title: place.place_name,
                    image: busImage
                });

                resultMarkers.push(placeMarker);

                // 왼쪽 목록 항목 생성
                const item = document.createElement("div");
                item.className = "place-item";

                const name = document.createElement("div");
                name.className = "place-name";
                name.textContent = place.place_name;

                const address = document.createElement("div");
                address.className = "place-address";
                address.textContent =
                    place.road_address_name ||
                    place.address_name ||
                    "주소 정보 없음";

                item.appendChild(name);
                item.appendChild(address);

                // 거리 정보가 있으면 함께 표시
                if (place.distance) {
                    const distance = document.createElement("div");
                    distance.className = "place-distance";

                    const distanceValue = Number(place.distance);

                    distance.textContent =
                        distanceValue >= 1000
                            ? (distanceValue / 1000).toFixed(1) + "km"
                            : distanceValue + "m";

                    item.appendChild(distance);
                }

                // 장소를 선택했을 때 실행할 함수
                function selectPlace() {
                    const selectedPosition = new kakao.maps.LatLng(
                        Number(place.y),
                        Number(place.x)
                    );

                    // 선택한 장소로 지도 이동
                    map.panTo(selectedPosition);

                    // 이전 선택 항목의 강조 표시 제거
                    document.querySelectorAll(".place-item").forEach(
                        function (element) {
                            element.classList.remove("selected");
                        }
                    );

                    item.classList.add("selected");

                    // 팝업 내용 생성
                    const popupContent = document.createElement("div");
                    popupContent.style.cssText =
                        "padding:10px;max-width:230px;" +
                        "font-size:13px;line-height:1.6;";

                    const popupName = document.createElement("strong");
                    popupName.textContent = place.place_name;

                    const popupAddress = document.createElement("div");
                    popupAddress.textContent =
                        place.road_address_name ||
                        place.address_name ||
                        "주소 정보 없음";

                    popupContent.appendChild(popupName);
                    popupContent.appendChild(popupAddress);

                    // 선택한 마커에 팝업 표시
                    infoWindow.setContent(popupContent);
                    infoWindow.open(map, placeMarker);

                    statusText.textContent =
                        place.place_name + " 위치를 표시했습니다.";
                }

                // 목록 클릭 시 해당 장소로 이동
                item.addEventListener("click", selectPlace);

                // 버스 마커 클릭 시 장소 정보 표시
                kakao.maps.event.addListener(
                    placeMarker,
                    "click",
                    selectPlace
                );

                resultsContainer.appendChild(item);
            });
        }

        // 버스 정류장 탭 클릭
        stopTab.addEventListener("click", function () {
            if (selectedType === "stop") return;

            selectedType = "stop";

            stopTab.classList.add("active");
            terminalTab.classList.remove("active");

            stopTab.setAttribute("aria-pressed", "true");
            terminalTab.setAttribute("aria-pressed", "false");

            searchNearbyPlaces();
        });

        // 버스 터미널 탭 클릭
        terminalTab.addEventListener("click", function () {
            if (selectedType === "terminal") return;

            selectedType = "terminal";

            terminalTab.classList.add("active");
            stopTab.classList.remove("active");

            terminalTab.setAttribute("aria-pressed", "true");
            stopTab.setAttribute("aria-pressed", "false");

            searchNearbyPlaces();
        });

        // 현재 위치 버튼 클릭
        locationButton.addEventListener("click", function () {
            getCurrentLocation();
        });
    </script>
</body>
</html>
